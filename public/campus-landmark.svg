<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Campus Academic Architecture Silhouette — Neo-Brutalist Style -->
  <defs>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--border-subtle, #D2D0C8)" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Subtle Grid -->
  <rect width="800" height="500" fill="url(#grid-pattern)" />

  <!-- Ground Line -->
  <line x1="40" y1="440" x2="760" y2="440" stroke="#171717" stroke-width="4" stroke-linecap="round" />

  <!-- Central Academic Clock Tower & Administration Building -->
  <!-- Main Tower Body -->
  <rect x="350" y="140" width="100" height="300" fill="#FFFFFF" stroke="#171717" stroke-width="3" />
  <!-- Tower Roof / Spire -->
  <polygon points="350,140 400,60 450,140" fill="#C8F169" stroke="#171717" stroke-width="3" />
  <!-- Clock Face -->
  <circle cx="400" cy="185" r="22" fill="#3155E7" stroke="#171717" stroke-width="2.5" />
  <circle cx="400" cy="185" r="18" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" />
  <line x1="400" y1="185" x2="400" y2="173" stroke="#171717" stroke-width="2" stroke-linecap="round" />
  <line x1="400" y1="185" x2="409" y2="185" stroke="#171717" stroke-width="2" stroke-linecap="round" />
  
  <!-- Belfry Arches -->
  <rect x="375" y="225" width="18" height="36" rx="9" fill="#F7F6F2" stroke="#171717" stroke-width="2" />
  <rect x="407" y="225" width="18" height="36" rx="9" fill="#F7F6F2" stroke="#171717" stroke-width="2" />
  
  <!-- Tower Windows -->
  <rect x="370" y="280" width="22" height="30" fill="#3155E7" fill-opacity="0.15" stroke="#171717" stroke-width="2" />
  <rect x="408" y="280" width="22" height="30" fill="#3155E7" fill-opacity="0.15" stroke="#171717" stroke-width="2" />
  <rect x="370" y="330" width="22" height="30" fill="#3155E7" fill-opacity="0.15" stroke="#171717" stroke-width="2" />
  <rect x="408" y="330" width="22" height="30" fill="#3155E7" fill-opacity="0.15" stroke="#171717" stroke-width="2" />
  <!-- Portal Entrance Arch -->
  <path d="M 382 440 L 382 400 A 18 18 0 0 1 418 400 L 418 440 Z" fill="#171717" />

  <!-- Left Building Wing (Science & Engineering Hall) -->
  <rect x="180" y="250" width="170" height="190" fill="#FFFFFF" stroke="#171717" stroke-width="3" />
  <!-- Pediment -->
  <polygon points="175,250 265,200 355,250" fill="#E9E8E2" stroke="#171717" stroke-width="3" />
  <!-- Ionic Columns -->
  <line x1="205" y1="250" x2="205" y2="440" stroke="#171717" stroke-width="4" />
  <line x1="245" y1="250" x2="245" y2="440" stroke="#171717" stroke-width="4" />
  <line x1="285" y1="250" x2="285" y2="440" stroke="#171717" stroke-width="4" />
  <line x1="325" y1="250" x2="325" y2="440" stroke="#171717" stroke-width="4" />
  <!-- Lab Windows Between Columns -->
  <rect x="215" y="275" width="20" height="35" fill="#C8F169" fill-opacity="0.4" stroke="#171717" stroke-width="1.5" />
  <rect x="255" y="275" width="20" height="35" fill="#C8F169" fill-opacity="0.4" stroke="#171717" stroke-width="1.5" />
  <rect x="295" y="275" width="20" height="35" fill="#C8F169" fill-opacity="0.4" stroke="#171717" stroke-width="1.5" />
  <rect x="215" y="335" width="20" height="35" fill="#C8F169" fill-opacity="0.4" stroke="#171717" stroke-width="1.5" />
  <rect x="255" y="335" width="20" height="35" fill="#C8F169" fill-opacity="0.4" stroke="#171717" stroke-width="1.5" />
  <rect x="295" y="335" width="20" height="35" fill="#C8F169" fill-opacity="0.4" stroke="#171717" stroke-width="1.5" />

  <!-- Far Left Wing (Classroom Block) -->
  <rect x="70" y="300" width="110" height="140" fill="#F7F6F2" stroke="#171717" stroke-width="3" />
  <polygon points="70,300 125,270 180,300" fill="#FF9F43" stroke="#171717" stroke-width="3" />
  <!-- Windows -->
  <rect x="90" y="325" width="25" height="25" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" />
  <rect x="135" y="325" width="25" height="25" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" />
  <rect x="90" y="370" width="25" height="25" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" />
  <rect x="135" y="370" width="25" height="25" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" />

  <!-- Right Building Wing (Central Library & IT Hub) -->
  <rect x="450" y="240" width="180" height="200" fill="#FFFFFF" stroke="#171717" stroke-width="3" />
  <!-- Dome / Rounded Top -->
  <path d="M 480 240 A 60 45 0 0 1 600 240 Z" fill="#3155E7" stroke="#171717" stroke-width="3" />
  <!-- Windows & Modern IT Bay -->
  <rect x="475" y="265" width="35" height="45" fill="#3155E7" fill-opacity="0.2" stroke="#171717" stroke-width="2" />
  <rect x="525" y="265" width="35" height="45" fill="#3155E7" fill-opacity="0.2" stroke="#171717" stroke-width="2" />
  <rect x="575" y="265" width="35" height="45" fill="#3155E7" fill-opacity="0.2" stroke="#171717" stroke-width="2" />
  <rect x="475" y="335" width="35" height="45" fill="#3155E7" fill-opacity="0.2" stroke="#171717" stroke-width="2" />
  <rect x="525" y="335" width="35" height="45" fill="#3155E7" fill-opacity="0.2" stroke="#171717" stroke-width="2" />
  <rect x="575" y="335" width="35" height="45" fill="#3155E7" fill-opacity="0.2" stroke="#171717" stroke-width="2" />

  <!-- Far Right Wing (Student Pavilion) -->
  <rect x="630" y="310" width="100" height="130" fill="#F7F6F2" stroke="#171717" stroke-width="3" />
  <polygon points="630,310 680,280 730,310" fill="#C8F169" stroke="#171717" stroke-width="3" />
  <rect x="650" y="335" width="22" height="25" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" />
  <rect x="688" y="335" width="22" height="25" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" />
  <rect x="650" y="380" width="22" height="25" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" />
  <rect x="688" y="380" width="22" height="25" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" />

  <!-- Trees / Greenery in Neo-Brutalist Block Style -->
  <!-- Left Tree -->
  <rect x="45" y="390" width="8" height="50" fill="#171717" />
  <circle cx="49" cy="370" r="24" fill="#C8F169" stroke="#171717" stroke-width="2.5" />
  <!-- Right Tree -->
  <rect x="740" y="395" width="8" height="45" fill="#171717" />
  <polygon points="744,340 720,400 768,400" fill="#C8F169" stroke="#171717" stroke-width="2.5" />

  <!-- Subtle Floating CampusFix Verification Pins -->
  <g transform="translate(230, 160)">
    <rect x="0" y="0" width="90" height="24" rx="4" fill="#FFFFFF" stroke="#171717" stroke-width="2" filter="drop-shadow(2px 2px 0px #171717)" />
    <circle cx="12" cy="12" r="5" fill="#3155E7" />
    <text x="24" y="16" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#171717">SCIENCE LAB</text>
  </g>
  <g transform="translate(480, 190)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#FFFFFF" stroke="#171717" stroke-width="2" filter="drop-shadow(2px 2px 0px #171717)" />
    <circle cx="12" cy="12" r="5" fill="#C8F169" />
    <text x="24" y="16" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#171717">IT LIBRARY</text>
  </g>
</svg>
